<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Producto</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header>
    <h1 th:text="${titulo}">Producto</h1>
</header>

<main class="contenedor">
    <form class="formulario"
          th:action="${producto.id == null} ? @{/productos/guardar} : @{/productos/actualizar/{id}(id=${producto.id})}"
          th:object="${producto}" method="post">

        <label>Nombre</label>
        <input type="text" th:field="*{nombre}" required>
        <span class="error-text" th:errors="*{nombre}"></span>

        <label>Categoría</label>
        <input type="text" th:field="*{categoria}" required>
        <span class="error-text" th:errors="*{categoria}"></span>

        <label>Cantidad</label>
        <input type="number" th:field="*{cantidad}" min="0" required>
        <span class="error-text" th:errors="*{cantidad}"></span>

        <label>Precio</label>
        <input type="number" th:field="*{precio}" min="0" step="0.01" required>
        <span class="error-text" th:errors="*{precio}"></span>

        <button type="submit">Guardar</button>
        <a class="boton secundario" th:href="@{/productos}">Cancelar</a>
    </form>
</main>
</body>
</html>
